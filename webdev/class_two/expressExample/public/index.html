 <!DOCTYPE html>
    <html>
    <head>
      <title>Navigation Page</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          text-align: center;
          margin-top: 100px;
        }
        .button {
          display: inline-block;
          padding: 20px 40px;
          margin: 20px;
          font-size: 24px;
          text-decoration: none;
          color: white;
          background-color: #007BFF;
          border-radius: 10px;
        }
        .button:hover {
          background-color: #0056b3;
        }
      </style>
    </head>
    <body>
      <h1>Where do you want to go?</h1>
      <a class="button" href="/here">Here</a>
      <a class="button" href="/there">There</a>
      <a class="button" href="/everywhere">Everywhere</a>
    </body>
</html>
